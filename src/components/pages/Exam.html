<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Exam</title>

<body>
    <h2>Practice Exam </h2>
    <p>Q. Write a program to display "Hello, World!" using console.log() or document.write(), or alert().</p>
    <script>
        // Using console.log()
        console.log("Hello, World!");

        // Using document.write()
        document.write("Hello, World!");

        // Using alert()
        alert("Hello, World!");
    </script>
</body>
